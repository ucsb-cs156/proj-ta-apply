name: "37-frontend-typecheck: TypeScript type checking"

# Runs the frontend's type check on its own (issue #146). `npm run typecheck` is `tsc -b`, the
# check that `npm run build` performs; without this workflow a type error first shows up inside
# the much slower 41-integration run, or in a failed deploy. (A plain `tsc --noEmit` is a no-op
# with this solution-style tsconfig, which is why the script exists.)

on:
  workflow_dispatch:
  pull_request:
    paths: [frontend/**, .github/workflows/37-frontend-typecheck.yml]
  push:
    branches: [main]
    paths: [frontend/**, .github/workflows/37-frontend-typecheck.yml]

jobs:
  frontend-typecheck:
    name: frontend-typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.21.0
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: ./frontend
      - run: npm run typecheck
        working-directory: ./frontend
