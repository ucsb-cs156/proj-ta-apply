# This workflow will build a Java project with Maven
# For more information see: https://help.github.com/actions/language-and-framework-guides/building-and-testing-java-with-maven

name: "41-integration: Integration tests"

env:
  # See: https://github.com/actions/setup-java#supported-distributions
  JAVA_DISTRIBUTION: ${{ vars.JAVA_DISTRIBUTION || 'temurin' }} 

on:
  workflow_dispatch:
  pull_request:
    paths: [src/**, pom.xml, lombok.config, frontend/**]
  push:
    branches: [ main ]
    paths: [src/**, pom.xml, lombok.config, frontend/**]

jobs:
  # The *WebIT classes run in parallel shards (issue #328; four since #361). Which class runs in
  # which shard is listed in src/test/resources/it-shards.json; ItShardAssignmentTests fails the
  # normal build if a class is in no shard. How to add a shard or a class, and the timings the
  # assignment is based on: docs/testing/integration-shards.md.
  it-shard:
    name: "Integration tests (shard ${{ matrix.shard }})"
    # Playwright misbehaves on Ubuntu versions not yet in its version mapping (e.g. ubuntu-26.04).
    # The PLAYWRIGHT_RUNS_ON organization/repository variable can pin the runner (e.g. ubuntu-24.04);
    # if it is not set, fall back to ubuntu-latest.
    runs-on: ${{ vars.PLAYWRIGHT_RUNS_ON || 'ubuntu-latest' }}
    timeout-minutes: 15
    strategy:
      # One shard failing must not cancel the others: their results (and artifacts) are still wanted.
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]

    steps:
    - uses: actions/checkout@v4

    - name: Set up Java (version from .java-version file)
      uses: actions/setup-java@v4
      with:
         distribution: ${{ env.JAVA_DISTRIBUTION }} 
         java-version-file: ./.java-version
         cache: 'maven'
         cache-dependency-path: 'pom.xml' 

    - name: List the classes of this shard
      id: classes
      run: |
        classes=$(jq -r --arg shard "${{ matrix.shard }}" '.[$shard] | join(",")' src/test/resources/it-shards.json)
        if [ -z "$classes" ]; then
          echo "::error::shard ${{ matrix.shard }} is not in src/test/resources/it-shards.json"
          exit 1
        fi
        echo "classes=$classes" >> "$GITHUB_OUTPUT"
        echo "Shard ${{ matrix.shard }} runs: $classes"

    # A failing test fails the shard on the first try; there is no retry (issue #376), so a new
    # flake is seen at once. What to do with a flaky test: docs/testing/flaky-tests.md.
    - name: Run IT tests with maven (shard ${{ matrix.shard }})
      run: |
        export WEBHOOK_SECRET=$(openssl rand -base64 32)
        INTEGRATION=true mvn -ntp -B test-compile failsafe:integration-test failsafe:verify \
          -Dit.test='${{ steps.classes.outputs.classes }}'

    # The trace (open it with `npx playwright show-trace`), screenshot, page text and browser log of
    # every failed test (issue #340). Named per shard so no shard's evidence overwrites another's.
    - name: Upload Playwright artifacts and failsafe reports
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: integration-artifacts-shard-${{ matrix.shard }}
        path: |
          target/playwright-artifacts/
          target/failsafe-reports/
        if-no-files-found: ignore
        retention-days: 14

  # Aggregate job. It keeps the job id and therefore the check name "build" that this workflow had
  # before it was sharded, so anything that expects the check "build" (branch protection, the
  # "enforce" job of 00-all-checks-pass.yml) keeps working. It fails if any shard failed or was
  # cancelled, and it runs even then (always()), so the check is never left "skipped".
  build:
    needs: it-shard
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
    - name: Fail unless every shard succeeded
      run: |
        echo "Result of the integration shards: ${{ needs.it-shard.result }}"
        if [ "${{ needs.it-shard.result }}" != "success" ]; then
          echo "::error::At least one integration shard did not succeed (failed, cancelled or skipped)."
          exit 1
        fi
