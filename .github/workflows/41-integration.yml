# This workflow will build a Java project with Maven
# For more information see: https://help.github.com/actions/language-and-framework-guides/building-and-testing-java-with-maven

name: "41-integration: Integration tests"

env:
  # See: https://github.com/actions/setup-java#supported-distributions
  JAVA_DISTRIBUTION: ${{ vars.JAVA_DISTRIBUTION || 'temurin' }} 

on:
  workflow_dispatch:
  pull_request:
    paths: [src/**, pom.xml, lombok.config, frontend/**]
  push:
    branches: [ main ]
    paths: [src/**, pom.xml, lombok.config, frontend/**]

jobs:
  build:
    # Playwright misbehaves on Ubuntu versions not yet in its version mapping (e.g. ubuntu-26.04).
    # The PLAYWRIGHT_RUNS_ON organization/repository variable can pin the runner (e.g. ubuntu-24.04);
    # if it is not set, fall back to ubuntu-latest.
    runs-on: ${{ vars.PLAYWRIGHT_RUNS_ON || 'ubuntu-latest' }}
    timeout-minutes: 20
    
    steps:
    - uses: actions/checkout@v4

    - name: Set up Java (version from .java-version file)
      uses: actions/setup-java@v4
      with:
         distribution: ${{ env.JAVA_DISTRIBUTION }} 
         java-version-file: ./.java-version
         cache: 'maven'
         cache-dependency-path: 'pom.xml' 

    # A failing test is re-run once (failsafe.rerunFailingTestsCount) so one unlucky run does not
    # cost the whole job, but a test that needed the retry is a flake, not a pass: the next steps
    # list it in the job summary and raise a warning, and docs/testing/flaky-tests.md says an issue
    # is opened for each. Never remove the "Report flaky tests" step without removing the retry.
    - name: Run IT tests with maven
      run: |
        export WEBHOOK_SECRET=$(openssl rand -base64 32)
        INTEGRATION=true mvn -ntp -B test-compile failsafe:integration-test failsafe:verify \
          -Dfailsafe.rerunFailingTestsCount=1

    - name: Report flaky tests (passed on retry)
      if: always()
      run: scripts/report-flaky-tests.sh target/failsafe-reports integration

    # The trace (open it with `npx playwright show-trace`), screenshot, page text and browser log of
    # every failed attempt, including attempts that passed on retry (issue #340). If the tests are
    # ever split into shards (issue #328), name this artifact per shard, e.g.
    # integration-artifacts-shard-${{ matrix.shard }}, so no shard's evidence overwrites another's.
    - name: Upload Playwright artifacts and failsafe reports
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: integration-artifacts
        path: |
          target/playwright-artifacts/
          target/failsafe-reports/
        if-no-files-found: ignore
        retention-days: 14
