<svg xmlns="http://www.w3.org/2000/svg" width="835" height="392" viewBox="0 0 835 392" font-family="'Arial Narrow', 'Liberation Sans Narrow', Arial, Helvetica, sans-serif" font-size="13">
  <title>Steps in a TA recruitment and their prerequisites</title>
  <desc>Nine steps as rounded boxes, left to right. Solid arrows are hard prerequisites; dashed arrows are soft prerequisites (the preferred order).</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#334155"/>
    </marker>
    <style>
      .box { fill: #f8fafc; stroke: #334155; stroke-width: 1.5; }
      .num { font-weight: 700; fill: #0f172a; }
      .label { fill: #1e293b; }
      .hard { stroke: #334155; stroke-width: 1.6; fill: none; marker-end: url(#arrow); }
      .soft { stroke: #334155; stroke-width: 1.6; fill: none; stroke-dasharray: 5 4; marker-end: url(#arrow); }
      .legend { fill: #475569; font-size: 12px; }
    </style>
  </defs>
  <rect class="box" x="20.0" y="110" width="95" height="62" rx="9"/>
  <text x="28.0" y="137.6"><tspan class="num">1.</tspan><tspan class="label" x="45.0">Create TA</tspan><tspan class="label" x="45.0" dy="16">Recruitment</tspan></text>
  <rect class="box" x="155.0" y="45" width="101" height="62" rx="9"/>
  <text x="163.0" y="72.5"><tspan class="num">2.</tspan><tspan class="label" x="180.0">Open TA</tspan><tspan class="label" x="180.0" dy="16">Applications</tspan></text>
  <rect class="box" x="158.0" y="175" width="95" height="62" rx="9"/>
  <text x="166.0" y="202.6"><tspan class="num">3.</tspan><tspan class="label" x="183.0">Budget /</tspan><tspan class="label" x="183.0" dy="16">Allocations</tspan></text>
  <rect class="box" x="296.0" y="45" width="101" height="62" rx="9"/>
  <text x="304.0" y="72.5"><tspan class="num">4.</tspan><tspan class="label" x="321.0">Close TA</tspan><tspan class="label" x="321.0" dy="16">Applications</tspan></text>
  <rect class="box" x="296.0" y="175" width="101" height="62" rx="9"/>
  <text x="304.0" y="194.6"><tspan class="num">5.</tspan><tspan class="label" x="321.0">Release</tspan><tspan class="label" x="321.0" dy="16">Allocations</tspan><tspan class="label" x="321.0" dy="16">to Faculty *</tspan></text>
  <rect class="box" x="437.0" y="175" width="71" height="62" rx="9"/>
  <text x="445.0" y="194.6"><tspan class="num">6.</tspan><tspan class="label" x="462.0">Open</tspan><tspan class="label" x="462.0" dy="16">Faculty</tspan><tspan class="label" x="462.0" dy="16">Ranking</tspan></text>
  <rect class="box" x="520.0" y="45" width="71" height="62" rx="9"/>
  <text x="528.0" y="64.5"><tspan class="num">7.</tspan><tspan class="label" x="545.0">Close</tspan><tspan class="label" x="545.0" dy="16">Faculty</tspan><tspan class="label" x="545.0" dy="16">Ranking</tspan></text>
  <rect class="box" x="603.0" y="175" width="89" height="62" rx="9"/>
  <text x="611.0" y="194.6"><tspan class="num">8.</tspan><tspan class="label" x="628.0">Assign</tspan><tspan class="label" x="628.0" dy="16">Candidates</tspan><tspan class="label" x="628.0" dy="16">to Slots</tspan></text>
  <rect class="box" x="732.0" y="175" width="83" height="62" rx="9"/>
  <text x="740.0" y="194.6"><tspan class="num">9.</tspan><tspan class="label" x="757.0">Release</tspan><tspan class="label" x="757.0" dy="16">Hiring</tspan><tspan class="label" x="757.0" dy="16">Decisions</tspan></text>
  <path class="hard" d="M 115.0 131.0 C 126.5 131.0, 126.5 76.0, 138.0 76.0 H 154.0"/>
  <path class="hard" d="M 115.0 151.0 C 128.0 151.0, 128.0 206.0, 141.0 206.0 H 157.0"/>
  <path class="hard" d="M 256.0 76.0 H 295.0"/>
  <path class="hard" d="M 253.0 206.0 H 295.0"/>
  <path class="hard" d="M 508.0 206.0 H 602.0"/>
  <path class="hard" d="M 692.0 206.0 H 731.0"/>
  <path class="hard" d="M 508.0 190.0 C 555.5 190.0, 555.5 157.0, 555.5 124.0 V 108.0"/>
  <path class="hard" d="M 346.5 45.0 V 22 H 773.5 V 174"/>
  <path class="soft" d="M 397.0 206.0 H 436.0"/>
  <path class="soft" d="M 591.0 76.0 H 647.5 V 174"/>
  <path class="soft" d="M 397.0 76.0 H 472.5 V 174"/>
  <line x1="30" y1="290" x2="75" y2="290" class="hard"/><text x="85" y="294" class="legend">hard prerequisite: must happen first</text>
  <line x1="30" y1="316" x2="75" y2="316" class="soft"/><text x="85" y="320" class="legend">soft prerequisite: the preferred order, not enforced</text>
  <text x="30" y="352" class="legend"><tspan font-weight="700">*</tspan> Allocation visibility has three settings: admins only (the default), each faculty member sees the allocations for the courses they teach,</text>
  <text x="30" y="370" class="legend">or all faculty see all allocations. Step 5 means moving off &quot;admins only&quot;.</text>
</svg>
