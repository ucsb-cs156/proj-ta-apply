# Use H2 in-memory database for tests
spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=PostgreSQL
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=false
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.liquibase.change-log=db/migration/changelog-master.json

# Use Ant-style path matching (required for FrontendController pattern)
spring.mvc.pathmatch.matching-strategy=ANT_PATH_MATCHER

# CORS
cors.allowed-origins=*

# Google OAuth2 (placeholder values so Spring Boot context loads in tests)
spring.security.oauth2.client.registration.google.client-id=test-client-id
spring.security.oauth2.client.registration.google.client-secret=test-client-secret

# Admin emails (required by AdminsController)
app.admin.emails=phtcon@ucsb.edu

# UCSB Academic Curriculum API. Tests never call the real API -- UCSBCurriculumServiceTests uses
# MockRestServiceServer -- but the placeholders must resolve for the Spring context to start.
app.ucsb.api.consumer_key=test-api-key
app.ucsb.api.host=https://api.example.org
app.subjectArea=CMPSC
app.startQtrYYYYQ=20211
app.endQtrYYYYQ=20254
