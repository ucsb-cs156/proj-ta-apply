# PostgreSQL datasource for production

server.port=${PORT:8080}
spring.datasource.url=${JDBC_DATABASE_URL}
spring.datasource.username=${JDBC_DATABASE_USERNAME}
spring.datasource.password=${JDBC_DATABASE_PASSWORD}

# MongoDB datasource for production (see docs/mongodb.md); on Dokku this is set up
# with `dokku mongo:create`/`dokku mongo:link`, which populate MONGO_URL.
spring.data.mongodb.uri=${MONGO_URL:${env.MONGO_URL:mongodb://localhost:27017/taapply}}


app.showSwaggerUILink=${SHOW_SWAGGER_UI_LINK:${env.SHOW_SWAGGER_UI_LINK:false}}

springdoc.swagger-ui.tryItOutEnabled=true
springdoc.swagger-ui.csrf.enabled=true
management.endpoints.web.exposure.include=mappings

app.admin.emails=${ADMIN_EMAILS:${env.ADMIN_EMAILS:phtcon@ucsb.edu}}
app.sourceRepo=${SOURCE_REPO:${env.SOURCE_REPO:https://github.com/ucsb-cs156/proj-ta-apply}}

spring.mvc.pathmatch.matching-strategy = ANT_PATH_MATCHER
server.compression.enabled=false

spring.mvc.format.date-time=iso

spring.jackson.time-zone=America/Los_Angeles
