# Active Spring profile is set by Maven at build time via the @springProfiles@ placeholder.
# localhost profile -> development (H2)
# production profile -> production (PostgreSQL)
spring.profiles.active=@springProfiles@

# Server port
server.port=${PORT:8080}

# Use Ant-style path matching so that FrontendController's /**/{path:[^\\.]*}
# pattern works correctly (same convention as proj-happycows)
spring.mvc.pathmatch.matching-strategy=ANT_PATH_MATCHER

# JPA / Hibernate – common settings (datasource is in profile-specific files)
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=false
spring.jpa.open-in-view=false
spring.liquibase.change-log=db/migration/changelog-master.json

# CORS – set CORS_ALLOWED_ORIGINS to restrict to specific domains in production
cors.allowed-origins=${CORS_ALLOWED_ORIGINS:*}

# Swagger / SpringDoc
springdoc.swagger-ui.tryItOutEnabled=true
springdoc.swagger-ui.csrf.enabled=true

# Google OAuth2
# For properties defined with var=${SYMBOL:${env.SYMBOL}}, the SYMBOL value on
# the left is from environment variables; env.SYMBOL picks up values from .env
# (via spring-dotenv plugin).
spring.security.oauth2.client.registration.google.client-id=${GOOGLE_CLIENT_ID:${env.GOOGLE_CLIENT_ID:client_id_unset}}
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET:${env.GOOGLE_CLIENT_SECRET:client_secret_unset}}

# OAuth login URL exposed to the frontend via /api/systemInfo
app.oauth.login=${OAUTH_LOGIN:${env.OAUTH_LOGIN:/oauth2/authorization/google}}

# Comma-separated list of admin email addresses (no spaces)
app.admin.emails=${ADMIN_EMAILS:${env.ADMIN_EMAILS:phtcon@ucsb.edu}}

# UCSB Academic Curriculum API. Get a key from the UCSB developer portal; see docs/ucsb-api.md.
app.ucsb.api.consumer_key=${UCSB_API_KEY:${env.UCSB_API_KEY:see-instructions-in-docs}}
app.ucsb.api.host=${UCSB_COURSES_API_HOST:${env.UCSB_COURSES_API_HOST:https://api.ucsb.edu}}

# Whether the Developer Mode switch exists on this instance (issue #217). Leave false in
# production; set true only on test instances (and on localhost, via .env).
app.enableDeveloperMode=${ENABLE_DEVELOPER_MODE:${env.ENABLE_DEVELOPER_MODE:false}}

# The single subject area whose courses this app manages.
app.subjectArea=${SUBJECT_AREA:${env.SUBJECT_AREA:CMPSC}}

# Nightly refresh of each open, upcoming or recently closed recruitment's course list from the
# UCSB API (issue #124). Off here so that tests and development never fire it; production turns
# it on. The cron is Spring's six-field form, in Pacific time.
app.recruitmentCourses.refreshEnabled=${RECRUITMENT_COURSES_REFRESH_ENABLED:${env.RECRUITMENT_COURSES_REFRESH_ENABLED:false}}
app.recruitmentCourses.refreshCron=${RECRUITMENT_COURSES_REFRESH_CRON:${env.RECRUITMENT_COURSES_REFRESH_CRON:0 0 3 * * *}}

# First quarter (YYYYQ) offered by the quarter dropdowns on the admin Courses page. The last
# quarter is not configured: it is derived from the quarter the UCSB API says it currently is,
# looking one quarter ahead (two in Spring, so both Summer and Fall are offered), so the range
# keeps itself current as quarters roll over.
app.startQtrYYYYQ=${START_QTR:${env.START_QTR:20211}}

# Only used if the UCSB quarter calendar API cannot be reached.
app.endQtrYYYYQ=${END_QTR:${env.END_QTR:20254}}

# Source repo URL (shown in system info)
app.sourceRepo=${SOURCE_REPO:${env.SOURCE_REPO:https://github.com/ucsb-cs156/proj-ta-apply}}

# Logging Levels
# Options are TRACE, DEBUG, INFO, WARN, ERROR, FATAL, OFF
logging.level.org.springframework.web=INFO
logging.level.org.hibernate=INFO
logging.level.org.springframework.security=INFO
logging.level.edu.ucsb.cs.taapply=DEBUG
