# Active Spring profile is set by Maven at build time via the @springProfiles@ placeholder.
# localhost profile -> development (H2)
# production profile -> production (PostgreSQL)
spring.profiles.active=@springProfiles@

# Server port
server.port=${PORT:8080}

# Use Ant-style path matching so that FrontendController's /**/{path:[^\\.]*}
# pattern works correctly (same convention as proj-happycows)
spring.mvc.pathmatch.matching-strategy=ANT_PATH_MATCHER

# JPA / Hibernate – common settings (datasource is in profile-specific files)
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=false
spring.jpa.open-in-view=false
spring.liquibase.change-log=db/migration/changelog-master.json

# CORS – set CORS_ALLOWED_ORIGINS to restrict to specific domains in production
cors.allowed-origins=${CORS_ALLOWED_ORIGINS:*}

# Swagger / SpringDoc
springdoc.swagger-ui.tryItOutEnabled=true
springdoc.swagger-ui.csrf.enabled=true

# Google OAuth2
# For properties defined with var=${SYMBOL:${env.SYMBOL}}, the SYMBOL value on
# the left is from environment variables; env.SYMBOL picks up values from .env
# (via spring-dotenv plugin).
spring.security.oauth2.client.registration.google.client-id=${GOOGLE_CLIENT_ID:${env.GOOGLE_CLIENT_ID:client_id_unset}}
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET:${env.GOOGLE_CLIENT_SECRET:client_secret_unset}}

# OAuth login URL exposed to the frontend via /api/systemInfo
app.oauth.login=${OAUTH_LOGIN:${env.OAUTH_LOGIN:/oauth2/authorization/google}}

# Comma-separated list of admin email addresses (no spaces)
app.admin.emails=${ADMIN_EMAILS:${env.ADMIN_EMAILS:phtcon@ucsb.edu}}

# Source repo URL (shown in system info)
app.sourceRepo=${SOURCE_REPO:${env.SOURCE_REPO:https://github.com/ucsb-cs156/proj-ta-apply}}

# Minimum delay (ms) between consecutive calls to external citation APIs (OpenAlex; Crossref and
# Semantic Scholar are paced independently below). See docs/README_API_CONFIG.md.
taapply.api.delay-ms=${TAAPPLY_API_DELAY_MS:${env.TAAPPLY_API_DELAY_MS:100}}

# Optional email address sent as the OpenAlex "polite pool" mailto param for higher rate limits.
# No API key is required for OpenAlex. See docs/README_API_CONFIG.md.
taapply.api.openalex.mailto=${OPENALEX_MAILTO:${env.OPENALEX_MAILTO:}}

# Minimum delay (ms) between consecutive calls to the Crossref API. See docs/README_API_CONFIG.md.
taapply.api.crossref.delay-ms=${CROSSREF_API_DELAY_MS:${env.CROSSREF_API_DELAY_MS:100}}

# Optional email address sent as the Crossref "polite pool" mailto param for higher rate limits.
# No API key is required for Crossref. See docs/README_API_CONFIG.md.
taapply.api.crossref.mailto=${CROSSREF_MAILTO:${env.CROSSREF_MAILTO:}}

# Minimum delay (ms) between consecutive calls to the Semantic Scholar API.
# See docs/README_API_CONFIG.md.
taapply.api.semanticscholar.delay-ms=${SEMANTIC_SCHOLAR_API_DELAY_MS:${env.SEMANTIC_SCHOLAR_API_DELAY_MS:100}}

# Optional API key for Semantic Scholar, raising its rate limit. Requests work without one.
# See docs/README_API_CONFIG.md.
taapply.api.semanticscholar.api-key=${SEMANTIC_SCHOLAR_API_KEY:${env.SEMANTIC_SCHOLAR_API_KEY:}}

# Optional email address sent in the User-Agent of the Check Links job's DOI content-negotiation
# requests to doi.org. See docs/README_API_CONFIG.md.
taapply.api.checklinks.mailto=${CHECKLINKS_MAILTO:${env.CHECKLINKS_MAILTO:}}

# Minimum delay (ms) between consecutive calls to DBLP's public search API. See
# docs/README_API_CONFIG.md.
taapply.api.dblp.delay-ms=${DBLP_API_DELAY_MS:${env.DBLP_API_DELAY_MS:100}}

# Logging Levels
# Options are TRACE, DEBUG, INFO, WARN, ERROR, FATAL, OFF
logging.level.org.springframework.web=INFO
logging.level.org.hibernate=INFO
logging.level.org.springframework.security=INFO
logging.level.edu.ucsb.cs.taapply=DEBUG
