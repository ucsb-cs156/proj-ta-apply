logging.level.org.springframework.security=DEBUG

spring.datasource.url=jdbc:h2:mem:${random.uuid}
spring.datasource.username=sa
spring.datasource.password=password
spring.datasource.driver-class-name=org.h2.Driver
spring.h2.console.settings.web-allow-others=true
spring.h2.console.enabled=true

spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=none

spring.liquibase.change-log=db/migration/changelog-master.json

# Embedded in-memory MongoDB (no external MongoDB instance required for integration tests)
de.flapdoodle.mongodb.embedded.version=7.0.12

# Mock OAuth provider backed by WireMock on port 8090
spring.security.oauth2.client.registration.my-oauth-provider.client-id=integrationtest
spring.security.oauth2.client.registration.my-oauth-provider.client-secret=secret
spring.security.oauth2.client.registration.my-oauth-provider.client-name=Mock OAuth2 Server
spring.security.oauth2.client.registration.my-oauth-provider.provider=my-oauth-provider
spring.security.oauth2.client.registration.my-oauth-provider.scope=https://www.googleapis.com/auth/userinfo.email,https://www.googleapis.com/auth/userinfo.profile,openid
spring.security.oauth2.client.registration.my-oauth-provider.redirect-uri=http://localhost:8080/login/oauth2/code/my-oauth-provider
spring.security.oauth2.client.registration.my-oauth-provider.authorization-grant-type=authorization_code

spring.security.oauth2.client.provider.my-oauth-provider.authorization-uri=http://localhost:8090/oauth/authorize
spring.security.oauth2.client.provider.my-oauth-provider.token-uri=http://localhost:8090/oauth/token
spring.security.oauth2.client.provider.my-oauth-provider.user-info-uri=http://localhost:8090/userinfo
spring.security.oauth2.client.provider.my-oauth-provider.user-info-authentication-method=header
spring.security.oauth2.client.provider.my-oauth-provider.user-name-attribute=sub
spring.security.oauth2.client.provider.my-oauth-provider.jwk-set-uri=http://localhost:8090/.well-known/jwks.json

app.oauth.login=/oauth2/authorization/my-oauth-provider
app.admin.emails=admingaucho@ucsb.edu
app.sourceRepo=https://github.com/ucsb-cs156/proj-ta-apply

app.playwright.headless=${HEADLESS:true}

# UCSB curriculum API is stubbed by the same WireMock server that mocks OAuth (port 8090), so
# integration tests exercise the populate flow without touching api.ucsb.edu or needing a key.
app.ucsb.api.consumer_key=integration-test-key
app.ucsb.api.host=http://localhost:8090
app.subjectArea=CMPSC
app.startQtrYYYYQ=20211
app.endQtrYYYYQ=20214
